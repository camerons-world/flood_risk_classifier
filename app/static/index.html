<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UK Flood Risk Classifier</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.25rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.subtitle { color: #767676; margin-top: 0; }
  select, button, input[type="text"], input[type="date"] {
    font-size: 1rem;
    padding: 0.5rem;
  }
  select, input[type="text"] { width: 100%; box-sizing: border-box; }
  .or-divider { text-align: center; color: #767676; font-size: 0.85rem; margin: 0.5rem 0; }
  .field-row { display: flex; gap: 0.75rem; align-items: center; margin: 0.75rem 0; flex-wrap: wrap; }
  .field-row label { font-size: 0.9rem; }
  button {
    cursor: pointer;
    padding: 0.5rem 1.25rem;
  }
  .nearby-list { font-size: 0.85rem; color: #767676; margin-top: 0.5rem; }
  .nearby-list ul { margin: 0.25rem 0 0; padding-left: 1.2rem; }
  #result { margin-top: 1.5rem; }
  .risk-badge {
    display: inline-block;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .risk-elevated { background: #fde2e1; color: #9c1c14; }
  .risk-normal { background: #e2f5e8; color: #146c2e; }
  .stale-banner {
    background: #fff4d6;
    color: #7a5c00;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    margin-top: 0.75rem;
    font-size: 0.9rem;
  }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  .muted { color: #767676; font-size: 0.85rem; }
  .error { color: #9c1c14; }
  .effect-up { color: #9c1c14; font-weight: 600; }
  .effect-down { color: #146c2e; font-weight: 600; }
  .factors-note { font-size: 0.8rem; color: #767676; margin-top: 0.5rem; }
  .view-toggle { font-size: 0.85rem; margin-top: 0.75rem; display: flex; align-items: center; gap: 0.4rem; }
  .view-toggle label { cursor: pointer; }
  code { font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>UK Flood Risk Classifier</h1>
  <p class="subtitle">Live 24h flood-warning risk for Greater London monitoring stations.</p>

  <select id="station-select"><option>Loading stations...</option></select>
  <p class="or-divider">or</p>
  <input type="text" id="postcode-input" placeholder="Enter a UK postcode, e.g. SW1A 1AA">

  <div class="field-row">
    <label for="date-input">Check a past date (optional):</label>
    <input type="date" id="date-input">
  </div>

  <button id="check-btn" disabled>Check risk</button>

  <div id="result"></div>

  <script>
    const select = document.getElementById("station-select");
    const postcodeInput = document.getElementById("postcode-input");
    const dateInput = document.getElementById("date-input");
    const button = document.getElementById("check-btn");
    const result = document.getElementById("result");
    let lastResult = null;
    let technicalView = false;

    // backtest date range: 2010-04-01 (first date with a full 90-day trailing
    // window) through yesterday -- matches app/model_wrapper.py's BACKTEST_MIN_DATE
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    dateInput.min = "2010-04-01";
    dateInput.max = yesterday.toISOString().slice(0, 10);

    select.addEventListener("change", () => { if (select.value) postcodeInput.value = ""; });
    postcodeInput.addEventListener("input", () => { if (postcodeInput.value) select.selectedIndex = -1; });

    async function loadStations() {
      const stations = await (await fetch("/stations")).json();
      stations.sort((a, b) => a.label.localeCompare(b.label));
      select.innerHTML = stations
        .map(s => `<option value="${s.station_id}">${s.label} (${s.catchment_name})</option>`)
        .join("");
      select.selectedIndex = -1;
      button.disabled = false;
    }

    async function checkRisk() {
      const postcode = postcodeInput.value.trim();
      const stationId = select.value;
      if (!postcode && !stationId) {
        result.innerHTML = `<p class="error">Pick a station or enter a postcode.</p>`;
        return;
      }

      const params = new URLSearchParams();
      params.set(postcode ? "postcode" : "station_id", postcode || stationId);
      if (dateInput.value) params.set("date", dateInput.value);

      button.disabled = true;
      result.innerHTML = `<p class="muted">${dateInput.value ? "Fetching historical readings..." : "Fetching live readings..."}</p>`;

      try {
        const response = await fetch(`/predict?${params.toString()}`);
        const body = await response.json();
        if (!response.ok) {
          result.innerHTML = `<p class="error">${body.detail || "Request failed"}</p>`;
          return;
        }
        lastResult = body;
        render(body);
      } catch (err) {
        result.innerHTML = `<p class="error">Could not reach the API.</p>`;
      } finally {
        button.disabled = false;
      }
    }

    function factorRows(explanation) {
      if (technicalView) {
        return explanation
          .map(f => `<tr><td><code>${f.feature}</code></td><td>${f.shap_contribution.toFixed(3)}</td></tr>`)
          .join("");
      }
      return explanation
        .map(f => {
          const up = f.shap_contribution > 0;
          const arrow = up ? "&uarr;" : "&darr;";
          const effectClass = up ? "effect-up" : "effect-down";
          return `<tr><td>${f.label}</td><td>${f.value}</td><td class="${effectClass}">${arrow} ${f.direction}</td></tr>`;
        })
        .join("");
    }

    function locationBlock(body) {
      if (!body.resolved_station) return "";
      const nearby = (body.nearby_stations || [])
        .map(s => {
          const risk = s.risk_score == null ? "unavailable" : `${(s.risk_score * 100).toFixed(1)}%${s.elevated_risk ? " (elevated)" : ""}`;
          return `<li>${s.label} (${s.distance_km.toFixed(1)}km) -- ${risk}</li>`;
        })
        .join("");
      return `
        <p class="muted">Nearest station: ${body.resolved_station.label} (${body.resolved_station.distance_km.toFixed(1)}km away)</p>
        ${nearby ? `<div class="nearby-list">Also nearby:<ul>${nearby}</ul></div>` : ""}
      `;
    }

    function render(body) {
      const pct = (body.risk_score * 100).toFixed(1);
      const badgeClass = body.elevated_risk ? "risk-elevated" : "risk-normal";
      const badgeText = body.elevated_risk ? "Elevated risk" : "Normal";
      const headerRow = technicalView
        ? "<tr><th>Feature</th><th>SHAP contribution</th></tr>"
        : "<tr><th>Factor</th><th>Reading</th><th>Effect on risk</th></tr>";
      const isBacktest = body.mode === "backtest";
      const asOfLabel = isBacktest ? `Historical risk as of ${body.as_of}` : `Readings as of ${body.as_of}`;

      result.innerHTML = `
        ${isBacktest ? '<p class="muted"><strong>Historical backtest</strong> -- not a live reading or a forecast.</p>' : ""}
        <p><span class="risk-badge ${badgeClass}">${badgeText}</span> risk score: <strong>${pct}%</strong></p>
        <p class="muted">Flags as elevated above ${(body.threshold * 100).toFixed(1)}% &middot; ${asOfLabel}</p>
        ${locationBlock(body)}
        ${body.stale ? '<div class="stale-banner">Live EA data unavailable -- showing last known readings.</div>' : ""}
        <table>
          <thead>${headerRow}</thead>
          <tbody>${factorRows(body.explanation)}</tbody>
        </table>
        <p class="factors-note">Biggest drivers of this score, most important first.</p>
        <div class="view-toggle">
          <input type="checkbox" id="technical-toggle" ${technicalView ? "checked" : ""}>
          <label for="technical-toggle">Show technical details (raw feature names + SHAP values)</label>
        </div>
      `;
      document.getElementById("technical-toggle").addEventListener("change", (e) => {
        technicalView = e.target.checked;
        render(lastResult);
      });
    }

    button.addEventListener("click", checkRisk);
    loadStations();
  </script>
</body>
</html>
